services:
  db:
    image: postgres:16-alpine
    container_name: aigc-db
    environment:
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: aigc
      POSTGRES_DB: aigc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigc -d aigc"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigc-backend
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://aigc:aigc@db:5432/aigc
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STORAGE_DIR: /app/storage
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-mock}
      GENERATION_WORKERS: "2"
      SEED_DEMO: "1"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - assets:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aigc-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  assets:
